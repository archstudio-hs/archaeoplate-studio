  @keyframes ring { 0%,33% { transform: scale(.2); opacity:0 } 35% { opacity:.95 } 60%,100% { transform: scale(2.4); opacity:0 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .cursor { transform: translate(274.0px,79px); } }
</style>
