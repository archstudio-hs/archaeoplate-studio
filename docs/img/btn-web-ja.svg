  @keyframes nudge { 0%,100% { transform: none } 50% { transform: translateX(3px) } }
  .pill { animation: pill 3s ease-in-out infinite; }
  .cursor { animation: move 3s ease-in-out infinite; }
  .press { animation: press 3s ease-in-out infinite; }
